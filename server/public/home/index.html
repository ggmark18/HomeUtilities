<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Home Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 20px;
    }

    h1 {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-icon {
      font-size: 2.5rem;
    }

    .status-label {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .status-clean .status-label { color: #4caf50; }
    .status-detected .status-label { color: #f44336; }
    .status-unknown .status-label { color: #888; }

    .meta {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #555;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .heartbeat-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      margin-right: 6px;
      transition: background 0.3s;
    }
    .heartbeat-dot.alive { background: #4caf50; }
    .heartbeat-dot.stale { background: #f44336; }

    .reset-btn {
      margin-top: 16px;
      width: 100%;
      background: transparent;
      color: #888;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .reset-btn:hover { color: #ccc; border-color: #555; }
    .reset-btn:disabled { opacity: 0.5; cursor: default; }

    .footer {
      margin-top: 24px;
      font-size: 0.7rem;
      color: #444;
      text-align: right;
    }

    #clock {
      font-size: 0.85rem;
      color: #555;
      text-align: right;
      margin-bottom: 16px;
    }

    /* ヘッダー */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .page-header h1 { margin-bottom: 0; }

    /* アプリ切り替えナビ（PC: ヘッダー内 / スマホ: フッター固定） */
    .app-switch {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .switch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      color: #888;
      background: transparent;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 13px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .switch-btn.active {
      color: #fff;
      background: #262626;
      border-color: #4a9eff;
    }
    .switch-icon { font-size: 15px; line-height: 1; }

    @media (max-width: 767px) {
      .app-switch {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        gap: 0;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
        background: #151515;
        border-top: 1px solid #2a2a2a;
        z-index: 100;
      }
      .switch-btn {
        flex: 1;
        flex-direction: column;
        gap: 2px;
        border: none;
        border-radius: 10px;
        padding: 8px 0;
        font-size: 11px;
      }
      .switch-btn.active { background: #262626; border-color: transparent; }
      .switch-icon { font-size: 20px; }
      body { padding-bottom: 64px; }
    }
  </style>
</head>
<body>
  <div id="clock">--:--:--</div>
  <header class="page-header">
    <h1>🏠 Home Control</h1>
    <nav class="app-switch">
      <a href="/home/bus/" class="switch-btn">
        <span class="switch-icon">🚌</span><span class="switch-label">Bus</span>
      </a>
      <a href="/home/control/" class="switch-btn active">
        <span class="switch-icon">🐱</span><span class="switch-label">Cat</span>
      </a>
    </nav>
  </header>

  <div class="card" id="catwatch-card">
    <div class="card-title">🐱 猫トイレ監視</div>
    <div class="status-row status-unknown" id="status-row">
      <span class="status-icon" id="status-icon">⏳</span>
      <span class="status-label" id="status-label">接続中...</span>
    </div>
    <div class="meta">
      <div>
        <span class="heartbeat-dot" id="heartbeat-dot"></span>
        <span id="heartbeat-label">OrangePi: 確認中</span>
      </div>
      <div id="last-event-label"></div>
    </div>
    <button class="reset-btn" id="reset-btn">🔄 表示を「きれい」にリセット</button>
  </div>

  <div class="footer" id="footer"></div>

  <script>
    // 時計
    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('ja-JP');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ハートビート監視（60秒以上途絶えたら stale）
    const HEARTBEAT_TIMEOUT_SEC = 60;
    let lastHeartbeat = null;

    function updateHeartbeatUI() {
      const dot = document.getElementById('heartbeat-dot');
      const label = document.getElementById('heartbeat-label');
      if (lastHeartbeat === null) {
        dot.className = 'heartbeat-dot';
        label.textContent = 'OrangePi: 未受信';
        return;
      }
      const ageSec = Math.floor(Date.now() / 1000) - lastHeartbeat;
      if (ageSec < HEARTBEAT_TIMEOUT_SEC) {
        dot.className = 'heartbeat-dot alive';
        label.textContent = `OrangePi: 稼働中 (${ageSec}秒前)`;
      } else {
        dot.className = 'heartbeat-dot stale';
        label.textContent = `OrangePi: 応答なし (${ageSec}秒前)`;
      }
    }
    setInterval(updateHeartbeatUI, 5000);

    function formatTime(ts) {
      return new Date(ts * 1000).toLocaleString('ja-JP');
    }

    function applyState(detection, lastEvent) {
      const row = document.getElementById('status-row');
      const icon = document.getElementById('status-icon');
      const label = document.getElementById('status-label');
      const eventLabel = document.getElementById('last-event-label');

      row.className = 'status-row status-' + (detection || 'unknown');

      if (detection === 'clean') {
        icon.textContent = '✅';
        label.textContent = 'きれいです';
      } else if (detection === 'detected') {
        icon.textContent = '💩';
        label.textContent = '糞を検知！';
      } else {
        icon.textContent = '⏳';
        label.textContent = '確認中...';
      }

      if (lastEvent) {
        const typeLabels = {
          detection_alert: '検知',
          cleanup_detected: '清掃完了',
          manual_reset: '手動リセット',
          startup_reset: 'OrangePi再起動',
        };
        const typeLabel = typeLabels[lastEvent.type] || lastEvent.type;
        eventLabel.textContent = `最終イベント: ${typeLabel} (${formatTime(lastEvent.timestamp)})`;
      }
    }

    // 手動リセット（OrangePi再起動でプロセス内の検知状態が失われ、
    // ダッシュボードが「検知」のまま固定されてしまった場合の救済用）
    document.getElementById('reset-btn').addEventListener('click', async () => {
      if (!confirm('実際に清掃済みであることを確認しましたか？\n「きれい」の状態にリセットします。')) return;
      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/home/api/catwatch/reset', { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
      } catch (err) {
        alert('リセットに失敗しました: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // SSE 接続
    function connectSSE() {
      const es = new EventSource('/home/api/catwatch/stream');

      es.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'heartbeat') {
          lastHeartbeat = data.timestamp;
          updateHeartbeatUI();
          return;
        }

        if (data.type === 'init') {
          lastHeartbeat = data.lastHeartbeat;
          applyState(data.detection, data.lastEvent);
          updateHeartbeatUI();
          return;
        }

        if (data.type === 'detection_alert' || data.type === 'cleanup_detected' || data.type === 'manual_reset' || data.type === 'startup_reset') {
          applyState(data.detection, { type: data.type, timestamp: data.timestamp });
          return;
        }
      };

      es.onerror = () => {
        document.getElementById('footer').textContent = '接続エラー - 再接続中...';
        es.close();
        setTimeout(connectSSE, 5000);
      };

      es.onopen = () => {
        document.getElementById('footer').textContent = '';
      };
    }

    connectSSE();
  </script>
</body>
</html>
