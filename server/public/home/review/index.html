<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>検知レビュー - Home Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 20px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.1rem;
      color: #888;
      letter-spacing: 0.05em;
    }

    .back-link {
      color: #4a9eff;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .empty-state {
      color: #666;
      font-size: 0.9rem;
      text-align: center;
      padding: 60px 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .detection-card {
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
    }

    .detection-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .detection-card .body {
      padding: 12px;
    }

    .detection-card .timestamp {
      font-size: 0.7rem;
      color: #666;
      margin-bottom: 10px;
    }

    .detection-card .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 10px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn-poop {
      background: #2e4a2e;
      color: #6fcf6f;
    }
    .btn-no-poop {
      background: #4a2e2e;
      color: #f47c7c;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.7rem;
      color: #444;
      text-align: right;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>📷 検知レビュー</h1>
    <a class="back-link" href="/home/control/">← 戻る</a>
  </header>

  <div id="content">
    <div class="empty-state">読み込み中...</div>
  </div>

  <div class="footer" id="footer"></div>

  <script>
    async function loadPending() {
      const content = document.getElementById('content');
      try {
        const res = await fetch('/home/api/catwatch/detections?label=pending');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { items } = await res.json();
        render(items);
      } catch (err) {
        content.innerHTML = `<div class="empty-state">読み込みに失敗しました: ${err.message}</div>`;
      }
    }

    function render(items) {
      const content = document.getElementById('content');
      if (!items.length) {
        content.innerHTML = '<div class="empty-state">レビュー待ちの検知はありません</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const item of items) {
        grid.appendChild(buildCard(item));
      }
      content.innerHTML = '';
      content.appendChild(grid);
    }

    function buildCard(item) {
      const card = document.createElement('div');
      card.className = 'detection-card';

      const img = document.createElement('img');
      img.src = `/home/api/catwatch/detections/${item.id}/image`;
      img.loading = 'lazy';
      card.appendChild(img);

      const body = document.createElement('div');
      body.className = 'body';

      const ts = document.createElement('div');
      ts.className = 'timestamp';
      ts.textContent = formatId(item.id);
      body.appendChild(ts);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const poopBtn = document.createElement('button');
      poopBtn.className = 'btn btn-poop';
      poopBtn.textContent = '✅ 糞でした';
      poopBtn.addEventListener('click', () => label(item.id, 'poop', card, [poopBtn, noPoopBtn]));

      const noPoopBtn = document.createElement('button');
      noPoopBtn.className = 'btn btn-no-poop';
      noPoopBtn.textContent = '❌ 誤検知';
      noPoopBtn.addEventListener('click', () => label(item.id, 'no_poop', card, [poopBtn, noPoopBtn]));

      actions.appendChild(poopBtn);
      actions.appendChild(noPoopBtn);
      body.appendChild(actions);
      card.appendChild(body);

      return card;
    }

    function formatId(id) {
      // 20260726_120000 -> 2026/07/26 12:00:00
      const m = id.match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})$/);
      if (!m) return id;
      const [, y, mo, d, h, mi, s] = m;
      return `${y}/${mo}/${d} ${h}:${mi}:${s}`;
    }

    async function label(id, value, card, buttons) {
      buttons.forEach((b) => (b.disabled = true));
      try {
        const res = await fetch(`/home/api/catwatch/detections/${id}/label`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: value }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        card.remove();
        const content = document.getElementById('content');
        if (!content.querySelector('.detection-card')) {
          content.innerHTML = '<div class="empty-state">レビュー待ちの検知はありません</div>';
        }
      } catch (err) {
        alert('振り分けに失敗しました: ' + err.message);
        buttons.forEach((b) => (b.disabled = false));
      }
    }

    loadPending();
  </script>
</body>
</html>
