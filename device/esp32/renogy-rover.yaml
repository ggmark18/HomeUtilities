# ============================================================
# Renogy Rover Li (RNG-CTRL-RVR20、G2ではない標準品) の状態を
# 純正 BT-2 モジュール経由の BLE で読み取り、EC2へ定期POSTする
#   × Waveshare ESP32-S3-Relay-6CH
#
# 経緯（詳細はSOLAR.md §5.6・§5.8）:
#   直結RS485（本機のA+/B-/⏚端子）は多数の組み合わせを試したが無応答のまま解決せず、
#   BT-2 + BLEでの疎通には成功した（SOC等の値が公式アプリと一致することを確認済み）ため、
#   本番の読み取り経路はBLE(BT-2)を正式採用した。直結RS485用のUART/modbus_controller設定は
#   本ファイルからは削除済み（SOLAR.md §5.6に経緯・試行錯誤の記録あり。再挑戦する場合は
#   ピン1/2をA/Bとして使う説が有力）。
#
# 構成:
#   - ボード電源: RoverのLOAD端子 → ヒューズ2A → 本機の電源ネジ端子(7〜36V)
#     ※LOAD端子は「常時ON」に設定しておくこと(Renogyアプリ側で設定)
#   - Rover状態の取得: 純正BT-2モジュール(RoverのRS485ポートに挿しっぱなし)に
#     本機がBLEクライアントとして接続し、Modbus形式のコマンドを送って読み取る
#   - DC出力制御: 内蔵リレー CH1 (GPIO1) の COM/NO 接点で開閉（Rover通信とは独立、GPIO直結）
#
# 事前準備:
#   - secrets.yaml に wifi_ssid / wifi_password / solar_secret を定義
# ============================================================

esphome:
  name: renogy-rover
  friendly_name: Renogy Rover

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  reboot_timeout: 0s   # クライアント無しでの自動再起動を無効化（HA等を常時繋がない構成のため）
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light   # 省電力（バッテリー駆動のため）。API/Web応答が多少遅延することは許容
  ap:
    ssid: "Renogy-Rover Fallback"

http_request:
  verify_ssl: true

captive_portal:

web_server:
  port: 80

# 時刻同期(スケジュール制御用。HAが無くてもNTPで動作)
time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Tokyo

# ---------------- BT-2(純正BLEモジュール)経由でのRover読み取り ----------------
# BT-TH-E72CF547 (MAC 7C:72:E7:2C:F5:47)。プロトコルはneilsheps/Renogy-BT2-Readerの
# リバースエンジニアリング結果に基づく（SOLAR.md §5.6参照）。
#   送信: サービス0xFFD0 / 特性0xFFD1
#   受信(通知): サービス0xFFF0 / 特性0xFFF1（送信側とは別サービスなので注意）
#   コマンド形式: 先頭バイトは固定0xFF（Roverの実アドレス0x01ではない）+ 標準Modbus RTU
esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: 7C:72:E7:2C:F5:47
    id: bt2_client
    on_connect:
      then:
        - lambda: |-
            ESP_LOGI("bt2", "Connected to BT-2");
    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGI("bt2", "Disconnected from BT-2");

globals:
  - id: g_soc
    type: float
    initial_value: 'NAN'
  - id: g_battery_voltage
    type: float
    initial_value: 'NAN'
  - id: g_charging_current
    type: float
    initial_value: 'NAN'
  - id: g_controller_temp
    type: float
    initial_value: 'NAN'
  - id: g_battery_temp
    type: float
    initial_value: 'NAN'
  - id: g_load_voltage
    type: float
    initial_value: 'NAN'
  - id: g_load_current
    type: float
    initial_value: 'NAN'
  - id: g_load_power
    type: float
    initial_value: 'NAN'
  - id: g_solar_voltage
    type: float
    initial_value: 'NAN'
  - id: g_solar_current
    type: float
    initial_value: 'NAN'
  - id: g_charging_power
    type: float
    initial_value: 'NAN'
  - id: g_generation_today
    type: float
    initial_value: 'NAN'
  - id: g_charging_state
    type: std::string
    initial_value: '""'
  - id: g_fault
    type: int
    initial_value: '0'
  - id: g_bt2_last_ok
    type: bool
    initial_value: 'false'

sensor:
  # BT-2からの応答を受け取り、レジスタ値をパースしてglobalsに保存する。
  # 2種類のリクエスト（コアレジスタ / 状態+障害）の応答を byte_count で判別する。
  - platform: ble_client
    type: characteristic
    ble_client_id: bt2_client
    service_uuid: fff0
    characteristic_uuid: fff1
    notify: true
    id: bt2_notify_raw
    internal: true
    lambda: |-
      if (x.size() < 5 || x[0] != 0xFF || x[1] != 0x03) return NAN;
      uint8_t byte_count = x[2];
      auto reg16 = [&](int i) -> uint16_t {
        int off = 3 + i * 2;
        return (uint16_t(x[off]) << 8) | x[off + 1];
      };

      if (byte_count == 40) {
        // 0x0100番地から20レジスタ（コアレジスタ〜本日の発電量まで）
        id(g_soc) = (float) reg16(0);
        id(g_battery_voltage) = reg16(1) * 0.1f;
        id(g_charging_current) = reg16(2) * 0.01f;
        uint16_t temps = reg16(3);
        uint8_t ctrl_raw = (temps >> 8) & 0xFF;
        uint8_t batt_raw = temps & 0xFF;
        id(g_controller_temp) = (ctrl_raw & 0x80) ? -(float)(ctrl_raw & 0x7F) : (float) ctrl_raw;
        id(g_battery_temp) = (batt_raw & 0x80) ? -(float)(batt_raw & 0x7F) : (float) batt_raw;
        id(g_load_voltage) = reg16(4) * 0.1f;
        id(g_load_current) = reg16(5) * 0.01f;
        id(g_load_power) = (float) reg16(6);
        id(g_solar_voltage) = reg16(7) * 0.1f;
        id(g_solar_current) = reg16(8) * 0.01f;
        id(g_charging_power) = (float) reg16(9);
        id(g_generation_today) = (float) reg16(19);
        id(g_bt2_last_ok) = true;
        ESP_LOGI("bt2", "core regs OK: soc=%.0f battV=%.1f chgW=%.0f solarV=%.1f genToday=%.0f",
                 id(g_soc), id(g_battery_voltage), id(g_charging_power),
                 id(g_solar_voltage), id(g_generation_today));
      } else if (byte_count == 6) {
        // 0x0120番地から3レジスタ（充電状態 + 障害ビット）
        uint16_t state_reg = reg16(0);
        uint32_t fault = (uint32_t(reg16(1)) << 16) | reg16(2);
        switch (state_reg & 0xFF) {
          case 0: id(g_charging_state) = "deactivated"; break;
          case 1: id(g_charging_state) = "activated"; break;
          case 2: id(g_charging_state) = "mppt"; break;
          case 3: id(g_charging_state) = "equalizing"; break;
          case 4: id(g_charging_state) = "boost"; break;
          case 5: id(g_charging_state) = "float"; break;
          case 6: id(g_charging_state) = "current_limiting"; break;
          default: id(g_charging_state) = "unknown"; break;
        }
        id(g_fault) = (int) fault;
        ESP_LOGI("bt2", "state regs OK: state=%s fault=0x%X", id(g_charging_state).c_str(), id(g_fault));
      } else {
        ESP_LOGW("bt2", "unexpected notify byte_count=%d", byte_count);
      }
      return x.size();

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  # 基板上のBOOTボタン
  - platform: gpio
    name: "Board Button"
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    entity_category: diagnostic

# BT-2へ交互に2種類のリクエストを送る（30秒間隔）
interval:
  - interval: 30s
    then:
      - ble_client.ble_write:
          id: bt2_client
          service_uuid: ffd0
          characteristic_uuid: ffd1
          # 0x0100番地から20レジスタ読み取り（コアレジスタ〜本日の発電量）
          value: [0xFF, 0x03, 0x01, 0x00, 0x00, 0x14, 0x51, 0xE7]
      - delay: 2s
      - ble_client.ble_write:
          id: bt2_client
          service_uuid: ffd0
          characteristic_uuid: ffd1
          # 0x0120番地から3レジスタ読み取り（充電状態 + 障害ビット）
          value: [0xFF, 0x03, 0x01, 0x20, 0x00, 0x03, 0x10, 0x23]

  # ---------------- EC2への副経路POST（§3契約、5分間隔） ----------------
  - interval: 5min
    then:
      - http_request.post:
          url: "https://www.cetacea.jp/home/api/solar/report"
          request_headers:
            Authorization: !secret solar_auth_header
            Content-Type: "application/json"
          body: !lambda |-
            char buf[450];
            snprintf(buf, sizeof(buf),
              "{\"soc\":%.0f,\"batteryVoltage\":%.2f,\"chargingCurrent\":%.2f,\"chargingPower\":%.0f,"
              "\"solarVoltage\":%.2f,\"solarCurrent\":%.2f,\"loadVoltage\":%.2f,\"loadCurrent\":%.2f,"
              "\"loadPower\":%.0f,\"batteryTemp\":%.0f,"
              "\"controllerTemp\":%.0f,\"generationToday\":%.0f,\"chargingState\":\"%s\",\"fault\":%d}",
              id(g_soc), id(g_battery_voltage), id(g_charging_current), id(g_charging_power),
              id(g_solar_voltage), id(g_solar_current), id(g_load_voltage), id(g_load_current),
              id(g_load_power), id(g_battery_temp),
              id(g_controller_temp), id(g_generation_today), id(g_charging_state).c_str(), id(g_fault));
            return std::string(buf);
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("solar_report", "POST -> HTTP %d", response->status_code);
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("solar_report", "POST failed (will retry in 5min)");


# ---------------- 制御 ----------------
switch:
  # ▼ メインの制御スイッチ: 内蔵リレー CH1 でDC出力をON/OFF
  - platform: gpio
    name: "DC Output"
    id: dc_output
    pin: GPIO1
    icon: "mdi:power-socket"
    restore_mode: RESTORE_DEFAULT_OFF

  # 予備リレー CH2〜CH6 (使わないならこのまま非表示)
  - platform: gpio
    name: "Relay CH2"
    pin: GPIO2
    disabled_by_default: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay CH3"
    pin: GPIO41
    disabled_by_default: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay CH4"
    pin: GPIO42
    disabled_by_default: true
    restore_mode: RESTORE_DEFAULT_OFF
  # CH5/CH6 はESP32-S3のストラッピングピン(基板側の設計)。
  # 警告は抑制するが、外部プルアップ/ダウンを付けないこと
  - platform: gpio
    name: "Relay CH5"
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    disabled_by_default: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    name: "Relay CH6"
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    disabled_by_default: true
    restore_mode: RESTORE_DEFAULT_OFF

# ---------------- 表示・音 ----------------
# 基板上のRGB LED: 通信状態の可視化に使う
light:
  - platform: esp32_rmt_led_strip
    name: "Status LED"
    id: status_led
    pin: GPIO38
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

output:
  - platform: ledc
    id: buzzer_out
    pin: GPIO21

rtttl:
  id: buzzer
  output: buzzer_out

# ---------------- ボタン ----------------
button:
  - platform: restart
    name: "Restart"
    entity_category: config
